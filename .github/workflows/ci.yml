name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Public Python tests
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check packages apps/api apps/worker

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Regenerate committed API types
        run: npm run typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build